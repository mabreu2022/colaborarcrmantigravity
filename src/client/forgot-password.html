<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Colaborar CRM</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-dark);
            font-family: var(--font-main);
            color: var(--text-primary);
            height: 100vh;
            margin: 0;
            overflow: auto;
        }

        .login-card {
            background-color: var(--bg-card);
            padding: 2.5rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            color: var(--text-primary);
            font-size: 1.8rem;
            font-family: var(--font-heading);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        .btn-full {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            text-align: center;
            margin-top: 1rem;
            display: none;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 0.75rem;
            border-radius: 0.5rem;
        }

        .success-message {
            color: #10B981;
            font-size: 0.875rem;
            text-align: center;
            margin-top: 1rem;
            display: none;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 0.75rem;
            border-radius: 0.5rem;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text-primary);
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <img src="logo.png" alt="Colaborar CRM" style="max-width: 200px; margin-bottom: 1rem; display: block; margin-left: auto; margin-right: auto;">
            <h1 id="pageTitle">Recuperar Senha</h1>
            <p id="pageDesc">Informe seu e-mail para receber um código de recuperação.</p>
        </div>

        <!-- Passo 1: Enviar Código -->
        <form id="forgotForm">
            <div class="form-group">
                <label for="email">E-mail de Cadastro</label>
                <input type="email" id="email" class="form-control" required placeholder="seu@email.com">
            </div>
            <button type="submit" id="btnSubmitForgot" class="btn-primary btn-full">Enviar Código</button>
        </form>

        <!-- Passo 2: Redefinir Senha (Escondido inicialmente) -->
        <form id="resetForm" style="display: none;">
            <div class="form-group">
                <label for="token">Código de Recuperação</label>
                <input type="text" id="token" class="form-control" required placeholder="Digite o código de 6 dígitos" maxlength="6" style="text-align: center; font-size: 1.1rem; letter-spacing: 0.1rem;">
            </div>
            <div class="form-group">
                <label for="newPassword">Nova Senha</label>
                <input type="password" id="newPassword" class="form-control" required placeholder="Minimo de 6 caracteres">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirmar Nova Senha</label>
                <input type="password" id="confirmPassword" class="form-control" required placeholder="Repita a nova senha">
            </div>
            <button type="submit" id="btnSubmitReset" class="btn-primary btn-full">Alterar Senha</button>
        </form>

        <div id="errorMsg" class="error-message"></div>
        <div id="successMsg" class="success-message"></div>

        <a href="login.html" class="back-link">Voltar para o Login</a>
    </div>

    <script type="module" src="js/forgot-password.js"></script>
</body>

</html>
