# ============================================================
# PILAR 1-B: Firebird 5.0 — Audit and Trace Services
# Arquivo: colaborarcrm_lgpd_trace.conf
# Salvar em: C:\Program Files\Firebird\Firebird_5_0\
# ============================================================
# Monitora SELECT, UPDATE, DELETE nas tabelas PII: CLIENTES e LEADS
# Referência: Firebird 5.0 Trace API — fbtrace service
# ============================================================

<database %DATABASE_PATH%\colaborarcrm.fdb>
    # Nome do trace para identificação nos logs
    enabled         true
    time_threshold  0          # Log queries com qualquer duração (0 = todas)
    max_sql_length  65536      # Tamanho máximo do SQL capturado

    # --- Eventos de STATEMENT (DML nas tabelas PII) ---
    log_statement_finish         true
    include_filter               ^(SELECT|UPDATE|DELETE).*\b(CLIENTES|LEADS)\b
    
    # --- Eventos de ERRORS ---
    log_errors                   true
    log_statement_start          false  # Evita duplicidade; capture apenas o finish

    # --- Eventos de CONNECTIONS (rastreio de quem acessa) ---
    log_connections              true
    log_disconnections           true

    # --- Eventos de TRANSACTIONS ---
    log_transactions             false  # Habilite se precisar rastrear transações

    # --- Eventos de CONTEXT VARIABLES ---
    log_context                  false

    # --- Autenticação e permissões ---
    log_procedure_finish         false
    log_trigger_finish           true   # Captura triggers PII (ex: auditoria interna)

    # --- Destino do log ---
    # Use fbtracemgr para redirecionar para arquivo
    # Veja o script PowerShell abaixo para automação
</database>

# ============================================================
# Para ATIVAR o trace via linha de comando (PowerShell Admin):
# ============================================================
#
# Iniciar trace e salvar em arquivo (sessão persistente):
#
#   fbtracemgr -start -name "LGPD_PII_Trace" ^
#     -config "C:\Program Files\Firebird\Firebird_5_0\colaborarcrm_lgpd_trace.conf" ^
#     > "C:\Logs\firebird_lgpd_trace.log" 2>&1
#
# Listar sessões ativas:
#   fbtracemgr -list
#
# Parar uma sessão (substitua SESSION_ID pelo ID listado acima):
#   fbtracemgr -stop -name "LGPD_PII_Trace"
#
# ============================================================
# ROTAÇÃO DE LOGS (Agendador de Tarefas do Windows)
# ============================================================
# Crie uma tarefa diária que execute:
#   Rename-Item "C:\Logs\firebird_lgpd_trace.log" `
#     "C:\Logs\firebird_lgpd_trace_$(Get-Date -Format 'yyyyMMdd').log"
# ============================================================
